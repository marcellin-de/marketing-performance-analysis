name: dbt CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  dbt-build-dev:
    name: dbt build (dev)
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DAGSTER_HOME: ${{ github.workspace }}/infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: |
          cd dbt_marketing_perf
          dbt deps

      - name: Run dbt build (dev)
        run: |
          cd dbt_marketing_perf
          dbt build --target dev


  dbt-build-prod:
    name: dbt build (prod)
    runs-on: ubuntu-latest
    needs: dbt-build-dev
    if: github.event_name == 'workflow_dispatch'

    # Protections GitHub : approval + secrets isolés
    environment:
      name: production

    env:
      # Les secrets prod doivent être configurés dans l'environnement "production"
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE_PROD }}
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DAGSTER_HOME: ${{ github.workspace }}/infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install dbt packages
        run: |
          cd dbt_marketing_perf
          dbt deps

      - name: Run dbt build (prod)
        run: |
          cd dbt_marketing_perf
          dbt build --target prod
