name: dbt CI (dev)

on:
  pull_request:
    branches: ["develop", "main"]
  push:
    branches: ["develop", "main"]
  workflow_dispatch:

jobs:
  dbt-build-dev:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DAGSTER_HOME: ${{ github.workspace }}/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install dbt dependencies
        run: |
          cd dbt_marketing_perf
          dbt deps

      - name: dbt build (dev)
        run: | 
          cd dbt_marketing_perf
          dbt build --target dev

  dbt-build-prod:
    runs-on: ubuntu-latest
    needs: dbt-build-dev
    if: github.event_name == 'workflow_dispatch'
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE_PROD }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.PROD_SNOWFLAKE_WAREHOUSE }}
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_marketing_perf
      DAGSTER_HOME: ${{ github.workspace }}/infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Install dbt dependencies
        run: |
          cd dbt_marketing_perf
          dbt deps

      - name: dbt build (prod)
        run: |
          cd dbt_marketing_perf 
          dbt build --target prod
