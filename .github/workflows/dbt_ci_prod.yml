name: dbt CI (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dbt-build-prod:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: dbt_marketing_perf
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE_PROD: ${{ secrets.SNOWFLAKE_DATABASE_PROD }}
      PROD_SNOWFLAKE_WAREHOUSE: ${{ secrets.PROD_SNOWFLAKE_WAREHOUSE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: dbt deps
        run: cd dbt_marketing_perf && dbt deps
      - name: dbt build (prod)
        run: cd dbt_marketing_perf && dbt build --target prod
